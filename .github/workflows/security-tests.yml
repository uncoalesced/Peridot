name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches requires-python in pyproject.toml
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Collects tests/ per [tool.pytest.ini_options] in pyproject.toml. The
      # security suite is included: its python_files pattern matches
      # *_tests.py, so security_tests.py runs here too rather than separately.
      - name: Run test suite
        run: |
          pytest