[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peridot-local"
version = "1.5.4"
description = "A sovereign local kernel with dynamic hardware scaling."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name="uncoalesced" }
]
dependencies = [
    "huggingface_hub",
    "requests",
    "colorama",
    "pynvml",
    "psutil",
    "sounddevice",
    "numpy",
    "pillow",
    "flask",
    "flask-cors",
    "llama-cpp-python"
]
[tool.setuptools.packages.find]
where = ["."]
exclude = ["assets*", "docs*", "input*", ".github*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_tests.py"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "llama.cpp",
    "venv",
    ".venv",
    "storage",
    "models",
    "logs",
]