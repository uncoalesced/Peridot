repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Generated public HF model metadata (scripts/build_model_catalog.py);
        # repo ids read as high-entropy strings.
        exclude: ^config/model_catalog\.json$

  # Enabled: the 101 pre-existing F-rule findings this hook was waiting on are
  # cleared, and `python -m ruff check .` now reports "All checks passed!".
  # The rule set lives in pyproject.toml under [tool.ruff.lint] (F + E9 only --
  # real defects, no style opinions).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
